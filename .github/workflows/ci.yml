# CI: push, PR 마다 테스트. 깨진 코드가 main 에 들어가기 전에 빨간불로 막음
name: ci

# 1. 언제 돌까 (이벤트)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 2. 안전 장치
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 3. 무슨 일을 할까 (잡). 잡 이름 test 가 곧 필수 상태 검사의 이름이 됨
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 4. 러너 준비: 코드, JDK, Gradle 캐시
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      # 5. 테스트 실행, 실패하면 보고서 남기기
      - name: 테스트
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon
      - name: 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
