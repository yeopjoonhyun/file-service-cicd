name: demo-env
on:
  workflow_dispatch:
jobs:
  envfile:
    runs-on: ubuntu-24.04
    steps:
      - name: 쓰고 바로 읽기
        run: |
          echo "BUILT_AT=$(date '+%F')" >> "$GITHUB_ENV"
          echo "같은 스텝: [$BUILT_AT]"
      - name: 다음 스텝에서 읽기
        run: |
          echo "다음 스텝: [$BUILT_AT]"
